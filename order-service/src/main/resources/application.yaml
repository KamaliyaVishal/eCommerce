spring:
  application:
    name: order-service

  # PostgresSQL Database Connection Settings
  datasource:
    url: jdbc:postgresql://localhost:5432/orderDB
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configurations
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081
  servlet:
    context-path: /order

#Eureka Config
eureka.client:
  service-url.defaultZone: http://localhost:8761/eureka