spring:
  application:
    name: api-gateway
  cloud:
    gateway.server.webflux:
      routes:
        # Route 1: order-service
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order/**

        # Route 2: inventory-service
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/product/**

#Eureka Config
eureka.client:
  service-url.defaultZone: http://localhost:8761/eureka